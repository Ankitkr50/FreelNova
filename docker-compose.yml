version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: freelnova-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neondb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d neondb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freelnova-cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: freelnova-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      CORS_ORIGINS: http://localhost
      DATABASE_URL: postgresql://neondb_owner:password123@postgres:5432/neondb?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: replace-with-access-secret
      JWT_REFRESH_SECRET: replace-with-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_EMAILS: fn.freelnova@gmail.com
      RAZORPAY_KEY_ID: rzp_test_SccNR3IGzdIMlu
      RAZORPAY_KEY_SECRET: 05JlTkL1H4eAa6hvln6cBNlz
      CLOUDINARY_CLOUD_NAME: diel3gts0
      CLOUDINARY_API_KEY: 443789661458519
      CLOUDINARY_API_SECRET: HypgtM7Rv39aIWxBJzFyDNN3bQs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build: ./client
    container_name: freelnova-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
